---
# Customer Site Deployment (React Router 7 SSR via Node.js)
#
# Serves the customer's public-facing website via server-side rendering.
# Fetches content from the WordPress WP-REST API.
# Each customer has a unique Docker image built from their forked repo.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-site
  namespace: {{NAMESPACE}}
  labels:
    app: customer-site
    customer: "{{CUSTOMER_ID}}"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: customer-site
      customer: "{{CUSTOMER_ID}}"

  template:
    metadata:
      labels:
        scaleweb.dk/altcha-client: "true"
        app: customer-site
        customer: "{{CUSTOMER_ID}}"
    spec:
      containers:
        - name: customer-site
          image: registry.scaleweb.dk/{{NAMESPACE}}-site:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            # Required self-hosted contact protection. The tenant secret must be
            # provisioned in this namespace before the deploy workflow can continue.
            - name: CONTACT_SPAM_PROVIDER
              value: "altcha"
            - name: ALTCHA_SITE_KEY
              value: "{{CUSTOMER_SLUG}}-site"
            - name: ALTCHA_PUBLIC_BASE_URL
              value: "https://altcha.scaledev.dk"
            - name: ALTCHA_VERIFY_BASE_URL
              value: "http://altcha-verify.contact-altcha.svc.cluster.local:3001"
            - name: ALTCHA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: contact-altcha
                  key: ALTCHA_SECRET_KEY
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: WP_API_URL
              value: "http://wordpress:80/wp-json"

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # SSR is bursty: a 200m limit CFS-throttles request bursts and drives
              # variable TTFB. 1 core lets Node SSR burst per request.
              cpu: 1000m
              # 128Mi left <10% headroom over the ~115Mi SSR baseline and paged
              # CustomerPodMemoryNearLimit (incident 2026-07-10 / CRM#433).
              memory: 256Mi

      imagePullSecrets:
        - name: registry-credentials

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

---
apiVersion: v1
kind: Service
metadata:
  name: customer-site
  namespace: {{NAMESPACE}}
  labels:
    app: customer-site
    customer: "{{CUSTOMER_ID}}"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: customer-site
    customer: "{{CUSTOMER_ID}}"
